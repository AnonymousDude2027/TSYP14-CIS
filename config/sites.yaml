# Site configuration.
#
# Selection criteria and the measurements behind them: docs/site_selection.md,
# regenerated by `python -m tsfdi fetch --select` / scripts/select_sites.py.
#
# Fields
#   id           GHCN-Daily station identifier (11 characters)
#   name         station name as published by NCEI
#   lat, lon     decimal degrees, elevation in metres
#   climate      climate class assigned a priori from the station description
#   variables    sensor/reference pairs used at this site
#   ref_power    NASA POWER parameter names for the reference series
#
# Measured completeness (fraction of days 2015-2024 with a non-null,
# quality-flag-clean value) is regenerated by scripts/select_sites.py into
# results/site_selection.csv; it is deliberately not duplicated here.

period:
  calibration: ["2015-01-01", "2019-12-31"]
  test: ["2020-01-01", "2024-12-31"]
  freq: "D"          # daily; hourly is designed for but not exercised (see docs/limitations.md)
  time_zone: "UTC"   # dates are calendar dates, no time-zone conversion is applied

variables:
  TMAX:
    sensor: TMAX
    reference: T2M_MAX
    units: degC
    kind: temperature          # magnitude expressed as % of seasonal range
  TMIN:
    sensor: TMIN
    reference: T2M_MIN
    units: degC
    kind: temperature
  PRCP:
    sensor: PRCP
    reference: PRECTOTCORR
    units: mm
    kind: multiplicative       # magnitude expressed as a multiplicative factor

sites:
